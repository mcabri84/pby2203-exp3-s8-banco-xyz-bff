# Configuracion compartida entregada por Spring Cloud Config.
info.proyecto.configuracion=config-server-semana8
management.info.env.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.audiences=banco-xyz
eureka.client.service-url.defaultZone=${EUREKA_URL:http://infra:${INFRA_SECRET}@localhost:8761/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.instance.hostname=${SERVICE_HOST:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
