spring.artemis.mode=native
spring.artemis.broker-url=${JMS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=banco
spring.artemis.password=${JMS_PASSWORD}
spring.jms.pub-sub-domain=false
info.proyecto.servicio=auditoria-service
spring.datasource.url=jdbc:h2:file:${AUDIT_DB_PATH:./datos/auditoria};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jms.listener.min-concurrency=1
spring.jms.listener.max-concurrency=2
