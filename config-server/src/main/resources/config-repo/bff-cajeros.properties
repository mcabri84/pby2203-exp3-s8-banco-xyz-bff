info.proyecto.servicio=bff-cajeros
app.api.connect-timeout-ms=1500
app.api.read-timeout-ms=2500
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false
resilience4j.circuitbreaker.instances.bancoApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bancoApi.sliding-window-size=4
resilience4j.circuitbreaker.instances.bancoApi.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.bancoApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bancoApi.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.bancoApi.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.bancoApi.register-health-indicator=false
resilience4j.circuitbreaker.instances.bancoApi.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.timelimiter.instances.bancoApi.timeout-duration=4s
resilience4j.timelimiter.instances.bancoApi.cancel-running-future=true
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
